<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMC Enroll Now</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body {
            background-image: url(https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/38df9671-1633-4828-b705-5972dadf6a57/OBMC+Quadrangle+2.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand"><img src="https://files.orangeapps.ph/disk001/School_Files/1/school-65/school_profile/1724046681-141.png" alt="OBMC Logo" width="50px" height="50px"></a>
            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Enroll Now</a></li>
                </ul>
                <form class="d-flex">
                    <input type="text"class="form-control me-2" placeholder="Search">
                    <button type="button" class="btn btn-primary">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <br>    
        <h1 style="text-align: center; color: #000000;">OBMC Student Enrollment Form</h1>
        <h6 style="text-align: center; color: #000000;">Fill out this form to enroll for the upcoming school year.</h6>
        <form style="padding: 20px; border-radius: 8px; background-color: #f9f9f9; box-shadow: 10px 10px 5px 0px rgba(0,0,0,0.75);-webkit-box-shadow: 10px 10px 5px 0px rgba(0,0,0,0.75);-moz-box-shadow: 10px 10px 5px 0px rgba(0,0,0,0.75); margin: 20px auto; max-width: 1200px;">
        <h2>Student Information</h2>
        <div class="mt-3 mb-3">
            <label class="form-label">First Name</label>
            <input type="textbox" class="form-control">
            <label class="form-label">Last Name</label>
            <input type="textbox" class="form-control">
            <label class="form-label">Birthdate:</label>
            <input type="textbox" placeholder="mm/dd/yyyy" class="form-control">
            <label class="form-label">Gender</label>
            <select class="form-select">
                <option>Select</option>
                <option>Male</option>
                <option>Female</option>
            </select>
            <label class="form-label">Grade Level</label>
            <select class="form-select">
                <option>Select</option>
                <option>Casa</option>
                <option>Grade 1</option>
                <option>Grade 2</option>
                <option>Grade 3</option>
                <option>Grade 4</option>
                <option>Grade 5</option>
                <option>Grade 6</option>
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>Grade 9</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>
            </select>
        </div>
        <br>
        <h2>Contact Details</h2>
        <div class="mt-3 mb-3l">
            <label class="form-label">Email Adress</label>
            <input type="textbox" placeholder="student@example.com" class="form-control">
            <label class="form-label">Contact Number</label>
            <input type="number" class="form-control">
        </div>
        <br>
        <h2>Other Information</h2>
        <div class="mb-3">
            <input type="radio" name="mode" class="form-check-input"><label>Face-to-Face</label>
            <br>
            <input type="radio" name="mode" class="form-check-input"><label>Online</label>
            <br><br>
            <input type="checkbox" class="form-check-input"><label>I confirm that the information provided is true and complete</label>
        </div>
        <div>
            <button type="button" class="btn btn-primary btn-block">Collect</button>
            <button type="button" class="btn btn-danger btn-block">Clear</button>
        </div>
    </form>
</body>
</html>
